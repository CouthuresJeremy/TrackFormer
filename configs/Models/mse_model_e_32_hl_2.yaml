# lightning.pytorch==2.4.0
seed_everything: 0
# model
model:
  class_path: src.my_model.transformer.TrackFormer
  init_args:
    input_dim: 3
    model_dim: 32
    num_classes: 2
    num_heads: 4
    num_layers: 2
    warmup: 100
    lr: 0.0005
    dropout: 0.0
    input_dropout: 0.0
    criterion: 
      - mse
      - mse
    use_scheduler: True
    norm_loss: std
